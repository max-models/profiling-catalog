name: Check

# `scope-profiler jobs check`: every packaged case folder's metadata parses, the runs it lists
# have their folders and profiles, every .h5 file opens and no file is larger than 50 MB.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # scope-profiler from devel until a release has `jobs check` (then: --from scope-profiler)
      - run: uvx --from "scope-profiler @ git+https://github.com/max-models/scope-profiler@devel" scope-profiler jobs check .
